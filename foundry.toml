[profile.default]
solc = '0.8.28'
bytecode_hash = "none"
evm_version = 'cancun'
optimizer_runs = 200
via_ir = true
# Sphinx encodes and replays generated airdrop migrations in one EVM execution.
memory_limit = 2147483648
extra_output = ["storageLayout"]
libs = ["node_modules", "lib"]
fs_permissions = [
  { access = "read-write", path = "./"},
  { access = "read", path = "../deploy-all-v6/deployments"}
]

[fuzz]
runs = 4096

[invariant]
runs = 1024
depth = 100
fail_on_revert = false

[lint]
exclude_lints = ["mixed-case-variable", "pascal-case-struct"]

[fmt]
number_underscore = "thousands"
multiline_func_header = "all"
wrap_comments = true
# Generated airdrop scripts (emitted by script/outfit_drop/generate-v6-airdrop.js). Their exact byte content is
# asserted by test/regression/AirdropV4BannysGeneration.t.sol, so reformatting them would break that test — keep
# them as the generator emits them and exclude them from fmt.
ignore = ["script/AirdropV4Bannys*.sol"]

[rpc_endpoints]
ethereum = "${RPC_ETHEREUM_MAINNET}"
optimism = "${RPC_OPTIMISM_MAINNET}"
base = "${RPC_BASE_MAINNET}"
arbitrum = "${RPC_ARBITRUM_MAINNET}"
ethereum_sepolia = "${RPC_ETHEREUM_SEPOLIA}"
optimism_sepolia = "${RPC_OPTIMISM_SEPOLIA}"
base_sepolia = "${RPC_BASE_SEPOLIA}"
arbitrum_sepolia = "${RPC_ARBITRUM_SEPOLIA}"
