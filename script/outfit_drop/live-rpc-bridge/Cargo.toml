[package]
name = "banny-resolver-live-rpc-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy = { version = "2.1", default-features = false }
sphinx-current = { package = "sphinx-client", git = "https://github.com/xBA5ED/sphinx-client", rev = "afcdc4e3eb1eeccea5d9c47977ec4ca381b4bbce" }
sphinx-client = { git = "https://github.com/xBA5ED/sphinx-client", rev = "9a31bf8fb9bc464243d3252c69fcdc1f6460fe3c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
