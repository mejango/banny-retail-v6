name: test
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - name: Install npm dependencies
        run: npm install
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
      - name: Check Safe airdrop exporter
        run: npm run test:airdrop:safe
      - name: Check Sphinx airdrop preparation
        run: npm run test:airdrop:sphinx
      - name: Run tests
        run: forge test --deny notes --fail-fast --summary --detailed --skip "*/script/**"
        env:
          RPC_ETHEREUM_MAINNET: ${{ secrets.RPC_ETHEREUM_MAINNET }}
      - name: Check contract sizes
        run: forge build --deny notes --sizes --skip "*/test/**" --skip "*/script/**" --skip SphinxUtils
